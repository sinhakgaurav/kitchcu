# Owner FAQ — paraphrase → answer_id → stable canonical_answer + options
version: "2026-07-15"
audience: owner
entries:
  - answer_id: owner.pricing.why_charge
    option_set_id: owner.after_pricing
    paraphrases:
      - Why do kitchen owners pay kitchCU?
      - Why am I charged a subscription?
      - Where does my subscription money go?
      - Server cost breakdown
      - What do I pay for?
    canonical_answer: |
      kitchCU is subscription SaaS — **zero per-order food commission**. Your monthly plan funds the rails that grow the kitchen and keep a **transparent layer** between you and customers (live-capture menus, order lifecycle, analytics, intelligence, support, optional live stream).

      Illustrative cost stack behind a **Growth plan (₹999/mo)**:
      • Servers & data (API, Postgres, Redis, media) — ≈ ₹280 (28%)
      • Operations & reliability (uptime, security, monitoring) — ≈ ₹180 (18%)
      • Support (AI assistant + human tickets) — ≈ ₹220 (22%)
      • Streaming & live media capacity — ≈ ₹150 (15%)
      • Growth intelligence & product (reports, CRM signals) — ≈ ₹169 (17%)

      You pay for growth assurance — not a cut of every bill.
    facts_refs: [plans, commission_on_food, cost_transparency]

  - answer_id: owner.pricing.plans
    option_set_id: owner.after_pricing
    paraphrases:
      - What are your prices?
      - How much does kitchCU cost?
      - Tell me about pricing plans
      - Is there commission?
      - Subscription fees
      - Pricing / plan / cost / fee / charge / commission
    canonical_answer: |
      kitchCU is subscription-only — **zero food commission** on orders.

      • **Starter** — ₹499/mo: 1 kitchen, manual + WhatsApp orders, live-capture menu
      • **Growth** — ₹999/mo: growth reports, CRM, marketing tools
      • **Scale** — ₹1,999/mo: multi-kitchen, priority support, advanced analytics

      All plans include order lifecycle and customer menu links.
      Ask “Why do kitchen owners pay?” for the server / ops / support / streaming cost breakdown.
    facts_refs: [plans, commission_on_food]

  - answer_id: owner.whatsapp.orders
    option_set_id: owner.after_whatsapp
    paraphrases:
      - How do WhatsApp orders work?
      - How do I get orders from WhatsApp?
      - Parse WhatsApp message
      - WA chat order
    canonical_answer: |
      Customers message your kitchen WhatsApp → kitchCU turns the text into a **draft order** →
      you review unmatched lines and **confirm** on kitchen.kitchcu.in (Orders).

      You keep the customer relationship. No per-order food commission.
    facts_refs: [order_lifecycle, commission_on_food]

  - answer_id: owner.menu.live_capture
    option_set_id: owner.after_menu
    paraphrases:
      - How do I add a menu?
      - Live capture photos?
      - Can I use stock images?
      - Cuisine veg non-veg dish
    canonical_answer: |
      Menu hierarchy: **cuisine → veg/non-veg → dish**.
      Hero photos must be **live-capture** in your kitchen — stock photos are not allowed for heroes.

      Add dishes: kitchen.kitchcu.in → Menu → Add dish. Share your customer menu link from Overview.
    facts_refs: [menu]

  - answer_id: owner.menu.from_whatsapp
    option_set_id: owner.after_menu_ingest
    paraphrases:
      - Create menu from WhatsApp catalog
      - Import dishes from my business WhatsApp
      - Read my price list from WA
      - Today's specials as menu
    canonical_answer: |
      Send or paste your business WhatsApp catalog / price list. kitchCU proposes dishes
      (name, price, veg/non-veg). You **review, attach live-capture photos, then publish** —
      nothing goes live without your confirmation.
    facts_refs: [menu]

  - answer_id: owner.reports.growth
    option_set_id: owner.after_reports
    paraphrases:
      - Show me analytics
      - Revenue report
      - Repeat customers
      - Peak hours
    canonical_answer: |
      Growth Reports (kitchen.kitchcu.in → Reports):
      • Revenue & trend · Top dishes · Peak hours (IST)
      • Repeat-customer rate & VIP segments · Win-back list (3+ weeks inactive)
    facts_refs: []

  - answer_id: owner.onboarding.otp
    option_set_id: owner.after_onboard
    paraphrases:
      - How do I sign up?
      - Owner login OTP
      - Create kitchen
      - Onboarding steps
    canonical_answer: |
      1. Open **kitchen.kitchcu.in** → Owner sign in
      2. Register phone → OTP verify
      3. Create kitchen → add dishes with live photos
      4. Share customer menu link
    facts_refs: [auth, domains]

  - answer_id: owner.orders.lifecycle
    option_set_id: owner.after_orders
    paraphrases:
      - Order statuses
      - Lifecycle
      - Manual order
      - Cancel order
    canonical_answer: |
      Order lifecycle: received → accepted → preparing → ready → out_for_delivery → delivered
      (or cancelled). Create manual orders or confirm WhatsApp drafts on kitchen.kitchcu.in → Orders.
    facts_refs: [order_lifecycle]

  - answer_id: owner.support.contact
    option_set_id: owner.after_support
    paraphrases:
      - Contact support
      - Speak to a human
      - Email help
      - Agent
    canonical_answer: |
      Human support: **hello@kitchcu.in** · Pune · Mon–Sat 9am–7pm IST · weekday reply within 24h.
      Or raise a ticket from this chat (I'll collect a few details).
    facts_refs: [support]

  - answer_id: owner.billing.subscription
    option_set_id: owner.after_billing
    paraphrases:
      - How do I pay my subscription?
      - Billing and invoices
      - GST invoice
      - Upgrade plan
      - Razorpay subscription
      - Payment failed for plan
    canonical_answer: |
      Owner plans are billed as **subscription SaaS** (Starter / Growth / Scale) — never a cut of food orders.

      • Manage plan: kitchen.kitchcu.in → **Subscription**
      • Pay via Razorpay when prompted
      • GST-ready receipts when GST is configured for your kitchen
      • Stuck payment? Raise a **billing** ticket with your kitchen code
    facts_refs: [plans, commission_on_food]

  - answer_id: owner.billing.refunds
    option_set_id: owner.after_billing
    paraphrases:
      - How do refunds work?
      - Customer wants refund
      - Partial refund
      - Gateway refund
      - Direct UPI refund
    canonical_answer: |
      From kitchen.kitchcu.in → **Orders** → open the order → **Refund**:

      • **Full** — payment gateway reverse when paid online, or direct UPI/bank with evidence
      • **Partial** — always direct transfer; attach a screenshot when required
      • Customer payout details come from their saved account (UPI/bank)

      Complete the transfer, then mark done — never invent refund timers.
    facts_refs: []

  - answer_id: owner.delivery.settings
    option_set_id: owner.after_delivery
    paraphrases:
      - Delivery fee setup
      - Delivery radius
      - Free delivery
      - Tracking link
      - Porter auto book
    canonical_answer: |
      Delivery is **owner-controlled** (no aggregator markups):

      • Set free/max radius and fee/km in kitchen delivery settings
      • Customers see a quote before checkout
      • Share tracking links; interval WhatsApp reminders are configurable
      • Optional Porter auto-book delay is yours to set

      Keep prep/delivery times honest — quality over fake speed races.
    facts_refs: []

  - answer_id: owner.marketing.crm
    option_set_id: owner.after_marketing
    paraphrases:
      - CRM customers
      - Coupons
      - Promotions
      - Targeted offers
      - Win back customers
    canonical_answer: |
      You own your CRM on kitchen.kitchcu.in:

      • **CRM** — spend, patterns, segments (Growth+ plans)
      • **Coupons** — % or flat offers for your kitchen
      • **Promotions** — target repeat / win-back customers
      • Reports → win-back list for quiet customers (3+ weeks)
    facts_refs: [plans]

  - answer_id: owner.tiffin.plans
    option_set_id: owner.after_tiffin
    paraphrases:
      - Tiffin plans
      - Meal subscription
      - Weekly tiffin
      - Combo meals
    canonical_answer: |
      Tiffin / meal plans grow recurring home-food revenue:

      • Create plans on kitchen.kitchcu.in (Tiffin area when enabled for your kitchen)
      • Customers subscribe from the customer app
      • Pair with combos and daily menu WhatsApp push

      Cloud kitchen / home food only — not dine-in.
    facts_refs: [product]

  - answer_id: owner.ingredients.stock
    option_set_id: owner.after_menu
    paraphrases:
      - Ingredient mapper
      - Stock deduct
      - Low stock
      - Recipe ingredients
      - Bulk prep
    canonical_answer: |
      Ingredient balance mapper:

      • Attach recipes to dishes
      • Stock deducts when you **accept** an order
      • Low-stock warnings help you pause dishes before overselling

      Keep recipes accurate for honest prep planning.
    facts_refs: [menu]

  - answer_id: owner.referrals.program
    option_set_id: owner.after_marketing
    paraphrases:
      - Referral program
      - Refer a kitchen
      - Customer referral reward
      - Invite kitchen
    canonical_answer: |
      Referrals reward growth without food commission:

      • Invite other kitchens; customers can refer kitchens too
      • Rewards (₹) follow Super Admin program settings
      • Credits apply per rules (e.g. first order / onboard)

      Wrong credit? Raise a billing ticket with referral codes.
    facts_refs: []

  - answer_id: owner.streaming.live
    option_set_id: owner.after_reports
    paraphrases:
      - Live stream
      - Go live
      - LiveKit
      - Customer watch cooking
    canonical_answer: |
      Optional **live cooking** (owner opt-in):

      • Go live from streaming controls when LiveKit is configured
      • Customers can filter kitchens that are live now
      • Never claim live unless the session is actually active
    facts_refs: [cost_transparency]

  - answer_id: owner.ratings.home_taste
    option_set_id: owner.after_orders
    paraphrases:
      - Home taste ratings
      - Customer reviews
      - Quality score
    canonical_answer: |
      Verified buyers leave **home taste** + quality ratings after delivery.
      Aggregates show on dishes — only from real orders.

      Use feedback with CRM/win-back; never fake review races.
    facts_refs: []

